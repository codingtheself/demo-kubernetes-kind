apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fibserver
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fibserver
  minReplicas: 1
  maxReplicas: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50